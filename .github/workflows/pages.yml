# Publie Pyodide-Qt sur GitHub Pages (https://smartaudiotools.github.io/qtpy6web/pyodide-qt/) : le binaire n'est jamais dans
# le dépôt, hebergement/telecharger.sh le rapporte de la release épinglée dans qtpy6web/versions.json (empreinte vérifiée).
# Ne tourne que si l'un de ces fichiers change, ou à la main. Réglages du dépôt : Pages → Source : GitHub Actions.
name: Pages
on:
  push:
    branches: [master]
    paths: [hebergement/**, qtpy6web/versions.json, .github/workflows/pages.yml]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: hebergement/telecharger.sh
      - run: mkdir site && cp -r exemple/pyodide-qt hebergement/index.html hebergement/LICENSE-Pyodide-Qt.txt site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
